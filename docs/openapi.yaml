openapi: 3.0.3
info:
  title: Internal Helpdesk API
  version: 1.0.0
  description: REST API aplikasi helpdesk internal.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Tickets
  - name: Users
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a requester
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201": { description: Account created }
        "400": { description: Invalid input }
        "409": { description: Email already registered }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: JWT and user profile }
        "401": { description: Invalid credentials }
  /api/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current user }
        "401": { description: Authentication required }
  /api/tickets:
    get:
      tags: [Tickets]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, resolved, closed] } }
        - { name: priority, in: query, schema: { type: string, enum: [low, medium, high, urgent] } }
        - { name: assignee, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: sortBy, in: query, schema: { type: string } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200": { description: Paginated ticket list }
        "401": { description: Authentication required }
    post:
      tags: [Tickets]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, category]
              properties:
                title: { type: string }
                description: { type: string }
                category: { type: string }
                priority: { type: string, enum: [low, medium, high, urgent] }
      responses:
        "201": { description: Ticket created }
        "400": { description: Invalid input }
  /api/tickets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Tickets]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Ticket and visible comments }
        "403": { description: Not permitted to view this ticket }
        "404": { description: Ticket not found }
    patch:
      tags: [Tickets]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [open, in_progress, resolved, closed] }
                priority: { type: string, enum: [low, medium, high, urgent] }
                assigneeId: { type: integer, nullable: true }
      responses:
        "200": { description: Ticket updated }
        "400": { description: Invalid transition or input }
        "403": { description: Not permitted }
        "404": { description: Ticket not found }
    delete:
      tags: [Tickets]
      summary: Delete a ticket
      description: Admins can delete any ticket. Requesters can delete only their own tickets while status is open. Agents cannot delete tickets.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Ticket and its comments deleted }
        "403": { description: Not permitted to delete this ticket }
        "404": { description: Ticket not found }
        "409": { description: Ticket changed during deletion }
  /api/tickets/{id}/comments:
    post:
      tags: [Tickets]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                isInternal: { type: boolean }
      responses:
        "201": { description: Comment created }
        "403": { description: Not permitted }
  /api/users:
    get:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: User list (admin only) }
        "403": { description: Admin role required }
  /api/agents:
    get:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Assignable agent and admin list (staff only) }
        "403": { description: Agent or admin role required }
  /api/users/{id}/role:
    patch:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [requester, agent, admin] }
      responses:
        "200": { description: Role updated }
        "403": { description: Admin role required }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
